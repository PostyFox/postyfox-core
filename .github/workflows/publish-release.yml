name: Publish Release
run-name: Publish ${{ startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version) }}

# Publishes a draft release after it has been validated on development.
# Production refuses a release tag until this has run.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. v1.5.0
        required: true
        type: string

permissions:
  contents: read

concurrency: release

jobs:
  publish:
    permissions:
      contents: write
      packages: read
    uses: aneillans/github-templates/.github/workflows/release-publish.yml@v1
    with:
      version: ${{ inputs.version }}
      images: |
        ghcr.io/postyfox/postyfox-core-core-api
        ghcr.io/postyfox/postyfox-core-post-api
        ghcr.io/postyfox/postyfox-core-worker
        ghcr.io/postyfox/postyfox-core-connectors-node
