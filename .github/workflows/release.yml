name: release

# Production release pipeline (semver, Conventional Commits).
#
# Manually dispatched, two modes:
#   • `version` blank  → NEW release: compute the next semver from commit messages, build
#                        version-stamped images, deploy to DEV, then (after production approval)
#                        tag the repo (vX.Y.Z + GitHub Release) and deploy PROD.
#   • `version` set    → REDEPLOY: skip build + tagging and (re)deploy that EXISTING tag's already
#                        built images. Deploys DEV first, then PROD after approval. Use for rollback
#                        or re-shipping a known-good version.
#
# Everyday pushes to main still auto-deploy DEV via platform-ci + deploy.yml; only this workflow
# touches production.
#
# DEV stays on docker-compose (self-hosted runner). PROD deploys to Kubernetes via Helm
# (deploy/helm/postyfox), using a kubeconfig stored in the `production` GitHub Environment's
# secrets — see deploy/helm/postyfox/values-prod.yaml for the cluster overlay and
# deploy/DEPLOYMENT.md for the full list of required secrets.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag/version to (re)deploy, e.g. 1.4.1 (the leading v is optional). Leave BLANK to cut a new release from the latest commits."
        required: false
        type: string

permissions:
  contents: write   # push the release tag + create the GitHub Release
  packages: write   # push images to GHCR

env:
  REGISTRY: ghcr.io

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}   # bare semver, no leading v
      ref: ${{ steps.resolve.outputs.ref }}           # git ref the deploy jobs check out
      is_new: ${{ steps.resolve.outputs.is_new }}     # 'true' = new release; 'false' = redeploy
      needs_build: ${{ steps.image_check.outputs.needs_build }}   # 'true' if the images must be (re)built
      build_sha: ${{ steps.image_check.outputs.build_sha }}       # commit SHA actually being built (== ref, resolved)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute next version (Conventional Commits)
        id: semver
        if: inputs.version == ''
        uses: paulhatch/semantic-version@v6.0.3
        with:
          tag_prefix: "v"
          # Conventional Commits: `type!:` or BREAKING CHANGE → major; `feat:` → minor; else patch.
          major_pattern: '/^\w+(\(.+\))?!:|BREAKING CHANGE/'
          minor_pattern: '/^feat(\(.+\))?:/'
          version_format: '${major}.${minor}.${patch}'
          search_commit_body: true
      - name: Resolve version + mode
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            V="${INPUT_VERSION#v}"                       # accept 1.4.1 or v1.4.1
            if ! git rev-parse -q --verify "refs/tags/v${V}" >/dev/null; then
              echo "❌ Tag v${V} not found — cannot redeploy a version that was never released."; exit 1
            fi
            echo "version=${V}" >> "$GITHUB_OUTPUT"
            echo "ref=v${V}" >> "$GITHUB_OUTPUT"
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "🔁 Redeploying existing release v${V}"
          else
            echo "version=${{ steps.semver.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "🆕 New release version ${{ steps.semver.outputs.version }}"
          fi
      - name: Check whether images need (re)building
        # A git tag existing does NOT guarantee its semver-tagged images were ever pushed to
        # GHCR (e.g. a tag created before this pipeline existed, or created outside of it).
        # Rather than silently deploying differently-versioned images (or failing deep inside
        # `docker compose pull`), rebuild from the tagged commit whenever the semver image is
        # missing so the correct version is baked into every image (and therefore the footer/
        # `/api/version`) either way. Checking core-api is a representative proxy for the whole
        # matrix — they're always built and pushed together.
        id: image_check
        env:
          IS_NEW: ${{ steps.resolve.outputs.is_new }}
          VERSION: ${{ steps.resolve.outputs.version }}
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          BUILD_SHA="$(git rev-parse "$REF")"
          echo "build_sha=${BUILD_SHA}" >> "$GITHUB_OUTPUT"

          if [ "$IS_NEW" = "true" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "🆕 New release — will build fresh images."
            exit 0
          fi

          IMAGE_REPOSITORY="${GITHUB_REPOSITORY,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          if docker manifest inspect "ghcr.io/${IMAGE_REPOSITORY}-core-api:${VERSION}" >/dev/null 2>&1; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "✅ Found published image ghcr.io/${IMAGE_REPOSITORY}-core-api:${VERSION} — reusing it."
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ No image published for v${VERSION} (tag exists but was never built) — rebuilding from ${REF} (commit ${BUILD_SHA}) so the correct version is baked in."
          fi

  build:
    # Builds whenever there's no already-published, correctly-versioned set of images: always for
    # a new release, and for a redeploy only if that version's images were never actually pushed.
    needs: compute-version
    if: needs.compute-version.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: core-api
            context: .
            dockerfile: Dockerfile
            project: src/PostyFox.Api.Core/PostyFox.Api.Core.csproj
            assembly: PostyFox.Api.Core.dll
          - service: post-api
            context: .
            dockerfile: Dockerfile
            project: src/PostyFox.Api.Post/PostyFox.Api.Post.csproj
            assembly: PostyFox.Api.Post.dll
          - service: worker
            context: .
            dockerfile: Dockerfile
            project: src/PostyFox.Worker.Posting/PostyFox.Worker.Posting.csproj
            assembly: PostyFox.Worker.Posting.dll
          - service: connectors-node
            context: src/connectors-node
            dockerfile: src/connectors-node/Dockerfile
            project: ""
            assembly: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.compute-version.outputs.ref }}
      - name: Normalize image repository name
        run: echo "IMAGE_REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Tag with the semver AND the actual built commit SHA for traceability. Note this is
          # NOT necessarily `github.sha` — a rebuild-on-redeploy builds the tagged commit, which
          # may differ from the commit that triggered this workflow run.
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}-${{ matrix.service }}:${{ needs.compute-version.outputs.version }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}-${{ matrix.service }}:${{ needs.compute-version.outputs.build_sha }}
          build-args: |
            PROJECT=${{ matrix.project }}
            ASSEMBLY=${{ matrix.assembly }}
            VERSION=${{ needs.compute-version.outputs.version }}

  deploy-dev:
    # Release artifacts MUST prove out on dev before prod. Runs whether we (re)built the images
    # this run or are redeploying already-published, correctly-versioned ones (build skipped).
    needs: [compute-version, build]
    if: |
      always() &&
      needs.compute-version.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: [self-hosted]
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.compute-version.outputs.ref }}

      - name: Resolve image repository
        id: image
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Determine stack dir
        id: stack
        run: echo "dir=/opt/postyfox/dev" >> "$GITHUB_OUTPUT"

      - name: Copy deployment files
        env:
          STACK_DIR: ${{ steps.stack.outputs.dir }}
        run: |
          echo "🧹 Removing stale gateway config, preserving any frontend-deployed overrides..."
          cd "$STACK_DIR"
          rm -rf .gwbak
          mkdir -p .gwbak/routes .gwbak/upstreams
          cp -p gateway/conf.d/routes/90-root.conf .gwbak/routes/ 2>/dev/null || true
          cp -p gateway/conf.d/upstreams/frontend.conf .gwbak/upstreams/ 2>/dev/null || true
          rm -rf gateway
          echo "📦 Copying deployment files to dev stack..."
          cp -a "$GITHUB_WORKSPACE"/deploy/docker-compose.server.yml \
            "$GITHUB_WORKSPACE"/deploy/docker-compose.dev.yml \
            "$GITHUB_WORKSPACE"/deploy/rabbitmq \
            "$GITHUB_WORKSPACE"/deploy/gateway \
            "$GITHUB_WORKSPACE"/deploy/vault \
            "$GITHUB_WORKSPACE"/deploy/fluent-bit \
            "$STACK_DIR"/
          echo "📦 Syncing otel collector config to dev stack..."
          mkdir -p "$STACK_DIR"/otel
          cp -a "$GITHUB_WORKSPACE"/deploy/otel/config.yaml \
            "$GITHUB_WORKSPACE"/deploy/otel/config.central.yaml \
            "$STACK_DIR"/otel/
          echo "🔧 Restoring frontend gateway overrides (no-op on a core-only stack)..."
          [ -f .gwbak/routes/90-root.conf ] && cp -p .gwbak/routes/90-root.conf gateway/conf.d/routes/90-root.conf || true
          [ -f .gwbak/upstreams/frontend.conf ] && cp -p .gwbak/upstreams/frontend.conf gateway/conf.d/upstreams/frontend.conf || true
          rm -rf .gwbak

      - name: Deploy dev stack
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ needs.compute-version.outputs.version }}
          STACK_DIR: ${{ steps.stack.outputs.dir }}
        run: |
          echo "🚀 Deploying release ${IMAGE_TAG} to dev stack..."
          cd "$STACK_DIR"
          [ -f .env ] || { echo '❌ Missing .env file'; exit 1; }
          WF_IMAGE_REPOSITORY="${IMAGE_REPOSITORY}"; WF_IMAGE_TAG="${IMAGE_TAG}"
          source .env 2>/dev/null || true
          export IMAGE_REPOSITORY="${WF_IMAGE_REPOSITORY}"
          export IMAGE_TAG="${WF_IMAGE_TAG}"
          export COMPOSE_PROJECT_NAME=postyfox-dev
          docker compose -f docker-compose.server.yml -f docker-compose.dev.yml pull || { echo '❌ Failed to pull images'; exit 1; }
          docker compose -f docker-compose.server.yml -f docker-compose.dev.yml up -d --build || { echo '❌ Failed to start services'; exit 1; }
          docker compose -f docker-compose.server.yml -f docker-compose.dev.yml restart gateway || { echo '❌ Failed to restart gateway'; exit 1; }
          echo '✅ Dev stack updated to release build'
          docker compose -f docker-compose.server.yml -f docker-compose.dev.yml ps

      - name: Health check
        env:
          STACK_DIR: ${{ steps.stack.outputs.dir }}
        run: |
          sleep 10
          cd "$STACK_DIR"
          docker compose -f docker-compose.server.yml -f docker-compose.dev.yml ps | grep -E '(core-api|post-api)' | grep -E '(Up|healthy)' || {
            echo '⚠️ Warning: Some services may not be healthy yet'
          }
          true

  deploy-prod:
    # Approval-gated via the `production` GitHub environment.
    needs: [compute-version, deploy-dev]
    runs-on: ubuntu-latest
    environment: production
    env:
      NAMESPACE: postyfox
      RELEASE_NAME: postyfox
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.compute-version.outputs.ref }}

      - name: Resolve image repository
        id: image
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Tag release + publish GitHub Release
        # New releases only — a redeploy targets an existing tag, so there's nothing to tag.
        # Runs post-approval (this whole job is gated by the `production` environment) but BEFORE
        # the deploy, so the tag exists the moment we ship to prod.
        if: needs.compute-version.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
          echo "🏷️ Tagged and released v${VERSION}"

      - name: Set up kubectl + Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Configure kubeconfig
        # KUBE_CONFIG is the base64-encoded contents of a kubeconfig scoped to this cluster (a
        # service-account token is strongly recommended over a personal/admin credential).
        run: |
          mkdir -p "$RUNNER_TEMP/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$RUNNER_TEMP/.kube/config"
          chmod 600 "$RUNNER_TEMP/.kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster connectivity
        run: kubectl cluster-info

      - name: Render secret overrides
        # Real secret VALUES never touch the repo or values-prod.yaml — they're written to a
        # gitignored, workflow-local file from GitHub Environment secrets and passed to `helm
        # upgrade` as an extra -f, then deleted in the Cleanup step below.
        run: |
          cat > "$RUNNER_TEMP/values-secrets.yaml" <<EOF
          postgres:
            password: "${{ secrets.DB_PASSWORD }}"
          rabbitmq:
            password: "${{ secrets.RABBITMQ_PASSWORD }}"
          secrets:
            externalPostgresConnection: "${{ secrets.EXTERNAL_POSTGRES_CONNECTION }}"
            hashiCorpVaultSecretId: "${{ secrets.VAULT_SECRET_ID }}"
            internalToken: "${{ secrets.INTERNAL_TOKEN }}"
            objectStoreAccessKey: "${{ secrets.RUSTFS_ACCESS_KEY }}"
            objectStoreSecretKey: "${{ secrets.RUSTFS_SECRET_KEY }}"
          config:
            hashiCorpVaultRoleId: "${{ secrets.VAULT_ROLE_ID }}"
          oauth2Proxy:
            clientSecret: "${{ secrets.OIDC_CLIENT_SECRET }}"
            cookieSecret: "${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}"
          redis:
            password: "${{ secrets.REDIS_PASSWORD }}"
          EOF

      - name: Helm upgrade --install (⚠️ PRODUCTION)
        env:
          IMAGE_TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          echo "🚀 Deploying release v${IMAGE_TAG} to prod k8s (namespace: ${NAMESPACE})..."
          helm upgrade --install "$RELEASE_NAME" deploy/helm/postyfox \
            --namespace "$NAMESPACE" --create-namespace \
            -f deploy/helm/postyfox/values-prod.yaml \
            -f "$RUNNER_TEMP/values-secrets.yaml" \
            --set image.tag="${IMAGE_TAG}" \
            --atomic --wait --timeout 5m \
            || { echo "❌ Helm upgrade failed (auto-rolled back by --atomic)"; exit 1; }
          echo "✅ Prod release v${IMAGE_TAG} deployed"

      - name: Health check
        run: |
          kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/part-of=postyfox
          kubectl -n "$NAMESPACE" rollout status deployment/"$RELEASE_NAME"-core-api --timeout=60s || \
            echo "⚠️ Warning: core-api rollout not confirmed healthy within timeout"
          kubectl -n "$NAMESPACE" rollout status deployment/"$RELEASE_NAME"-post-api --timeout=60s || \
            echo "⚠️ Warning: post-api rollout not confirmed healthy within timeout"

      - name: Cleanup secret overrides
        if: always()
        run: rm -f "$RUNNER_TEMP/values-secrets.yaml" "$RUNNER_TEMP/.kube/config"
