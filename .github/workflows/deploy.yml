name: Deploy

# Ships images already built by Build; nothing is rebuilt here.
#   development: automatic after every successful main Build, or manual for any built commit
#   production:  manual only, and only for built commits on main.
#                Optionally tags vX.Y.Z (the version baked in at build) and publishes a GitHub Release.

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [development, production]
        default: development
      sha:
        description: Commit to deploy (blank = newest built commit on main)
        required: false
        type: string
      release:
        description: Production only. Tag vX.Y.Z and publish a GitHub Release after deploying
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/postyfox/postyfox-core

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve environment
        id: target
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: echo "environment=${INPUT_ENVIRONMENT:-development}" >> "$GITHUB_OUTPUT"

      # SHA-tagged images exist only for commits Build validated and pushed
      - name: Resolve commit
        id: resolve
        uses: aneillans/github-templates/actions/resolve-deploy@v1
        with:
          images: |
            ghcr.io/postyfox/postyfox-core-core-api
            ghcr.io/postyfox/postyfox-core-post-api
            ghcr.io/postyfox/postyfox-core-worker
            ghcr.io/postyfox/postyfox-core-connectors-node
          run_sha: ${{ github.event.workflow_run.head_sha }}
          sha: ${{ inputs.sha }}
          require_branch: ${{ steps.target.outputs.environment == 'production' && 'main' || '' }}
          version_env: POSTYFOX_VERSION
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}

  development:
    needs: resolve
    if: needs.resolve.outputs.environment == 'development'
    runs-on: [self-hosted]
    environment: development
    concurrency: deploy-development
    env:
      STACK_DIR: /opt/postyfox/dev
      IMAGE_TAG: ${{ needs.resolve.outputs.sha }}
      COMPOSE_PROJECT_NAME: postyfox-dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Copy deployment files
        run: |
          cd "$STACK_DIR"
          # The frontend deploy drops these two fragments into core's gateway tree; keep them across
          # the wipe, since conf.d/*.conf is glob-included and stale fragments would otherwise load.
          rm -rf .gwbak
          mkdir -p .gwbak/routes .gwbak/upstreams
          cp -p gateway/conf.d/routes/90-root.conf .gwbak/routes/ 2>/dev/null || true
          cp -p gateway/conf.d/upstreams/frontend.conf .gwbak/upstreams/ 2>/dev/null || true
          rm -rf gateway
          cp -a "$GITHUB_WORKSPACE"/deploy/docker-compose.server.yml \
            "$GITHUB_WORKSPACE"/deploy/docker-compose.dev.yml \
            "$GITHUB_WORKSPACE"/deploy/rabbitmq \
            "$GITHUB_WORKSPACE"/deploy/gateway \
            "$GITHUB_WORKSPACE"/deploy/oauth2-proxy \
            "$GITHUB_WORKSPACE"/deploy/vault \
            "$GITHUB_WORKSPACE"/deploy/fluent-bit \
            "$STACK_DIR"/
          # otel/ may hold certs, so only sync the config files
          mkdir -p otel
          cp -a "$GITHUB_WORKSPACE"/deploy/otel/config.yaml "$GITHUB_WORKSPACE"/deploy/otel/config.central.yaml otel/
          [ -f .gwbak/routes/90-root.conf ] && cp -p .gwbak/routes/90-root.conf gateway/conf.d/routes/ || true
          [ -f .gwbak/upstreams/frontend.conf ] && cp -p .gwbak/upstreams/frontend.conf gateway/conf.d/upstreams/ || true
          rm -rf .gwbak

      - name: Deploy dev stack
        run: |
          cd "$STACK_DIR"
          [ -f .env ] || { echo "::error::Missing $STACK_DIR/.env"; exit 1; }
          # .env may pin IMAGE_REPOSITORY/IMAGE_TAG; the workflow's values win
          wf_repository="$IMAGE_REPOSITORY"; wf_tag="$IMAGE_TAG"
          source .env 2>/dev/null || true
          export IMAGE_REPOSITORY="$wf_repository" IMAGE_TAG="$wf_tag"
          compose() { docker compose -f docker-compose.server.yml -f docker-compose.dev.yml "$@"; }
          compose pull
          compose up -d --build
          # conf.d/templates are bind-mounted; up -d doesn't pick up content changes
          compose restart gateway oauth2-proxy
          compose ps

  production:
    needs: resolve
    if: needs.resolve.outputs.environment == 'production'
    concurrency: deploy-production
    uses: aneillans/github-templates/.github/workflows/helm-deploy.yml@v1
    with:
      environment: production
      # cluster API is only reachable from the self-hosted runner
      runs_on: self-hosted
      ref: ${{ needs.resolve.outputs.sha }}
      chart: deploy/helm/postyfox
      release: postyfox
      namespace: postyfox
      values_files: deploy/helm/postyfox/values-prod.yaml
      set_values: image.tag=${{ needs.resolve.outputs.sha }}
      secret_values: |
        rabbitmq.password=RABBITMQ_PASSWORD
        redis.password=REDIS_PASSWORD
        secrets.externalPostgresConnection=EXTERNAL_POSTGRES_CONNECTION
        secrets.hashiCorpVaultSecretId=VAULT_SECRET_ID
        secrets.internalToken=INTERNAL_TOKEN
        secrets.objectStoreAccessKey=RUSTFS_ACCESS_KEY
        secrets.objectStoreSecretKey=RUSTFS_SECRET_KEY
        secrets.emailPassword=EMAIL_SMTP_PASSWORD
        config.hashiCorpVaultRoleId=VAULT_ROLE_ID
        oauth2Proxy.clientSecret=OIDC_CLIENT_SECRET
        oauth2Proxy.cookieSecret=OAUTH2_PROXY_COOKIE_SECRET
      var_values: |
        config.email.host=EMAIL_SMTP_HOST
        config.email.user=EMAIL_SMTP_USER
        config.email.from=EMAIL_SMTP_FROM
    # everything mapped above is a production environment secret/variable, read by the template job

  release:
    needs: [resolve, production]
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: aneillans/github-templates/actions/tag-release@v1
        with:
          sha: ${{ needs.resolve.outputs.sha }}
          version: ${{ needs.resolve.outputs.version }}
