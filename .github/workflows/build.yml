name: Build
run-name: ${{ github.ref_type == 'tag' && format('Build {0}', github.ref_name) || github.event.head_commit.message || format('Build {0}', github.ref_name) }}

# Validates, then builds and pushes every service image to GHCR tagged with the full commit SHA.
# Deploy only ever ships images built here. Release dispatches this on the tag, which also tags
# the images with the version and stamps them with it exactly.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/pr.yml
    secrets: inherit

  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.stamp }}
    steps:
      - name: Compute version (PR branches and titles, commit messages)
        id: version
        uses: aneillans/github-templates/actions/next-version@v1

  images:
    needs: [validate, version]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: core-api
            context: .
            dockerfile: Dockerfile
            target: final
            project: src/PostyFox.Api.Core/PostyFox.Api.Core.csproj
            assembly: PostyFox.Api.Core.dll
          - service: post-api
            context: .
            dockerfile: Dockerfile
            target: final
            project: src/PostyFox.Api.Post/PostyFox.Api.Post.csproj
            assembly: PostyFox.Api.Post.dll
          - service: worker
            context: .
            dockerfile: Dockerfile
            # only the worker shells out to ffmpeg
            target: with-ffmpeg
            project: src/PostyFox.Worker.Posting/PostyFox.Worker.Posting.csproj
            assembly: PostyFox.Worker.Posting.dll
          - service: connectors-node
            context: src/connectors-node
            dockerfile: src/connectors-node/Dockerfile
            target: runtime
            project: ""
            assembly: ""
    uses: aneillans/github-templates/.github/workflows/docker-build-push.yml@v1
    with:
      registry: ghcr.io
      registry_username: ${{ github.actor }}
      image_name: postyfox/postyfox-core-${{ matrix.service }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      target: ${{ matrix.target }}
      build_args: |
        PROJECT=${{ matrix.project }}
        ASSEMBLY=${{ matrix.assembly }}
        VERSION=${{ needs.version.outputs.version }}
    secrets:
      registry_password: ${{ secrets.GITHUB_TOKEN }}
      build_secrets: |
        sixlabors_license=${{ secrets.SIXLABORS_LICENSE_KEY }}
