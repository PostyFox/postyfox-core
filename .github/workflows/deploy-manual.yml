name: deploy-manual

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - development
          - production
      image_tag:
        description: 'Image tag to deploy (defaults to latest main commit)'
        required: false
        type: string
      confirm:
        description: 'Type "DEPLOY" to confirm'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  validate-confirmation:
    name: Validate confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: github.event.inputs.confirm != 'DEPLOY'
        run: |
          echo "❌ Deployment cancelled: confirmation not provided"
          echo "Please re-run and type 'DEPLOY' in the confirmation field"
          exit 1
      - run: echo "✅ Deployment confirmed"

  build-images:
    # Build + push container images to ghcr tagged with the commit SHA
    # (mirrors the `images` job in platform-ci.yml).
    needs: validate-confirmation
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: core-api
            context: .
            dockerfile: Dockerfile
            project: src/PostyFox.Api.Core/PostyFox.Api.Core.csproj
            assembly: PostyFox.Api.Core.dll
          - service: post-api
            context: .
            dockerfile: Dockerfile
            project: src/PostyFox.Api.Post/PostyFox.Api.Post.csproj
            assembly: PostyFox.Api.Post.dll
          - service: worker
            context: .
            dockerfile: Dockerfile
            project: src/PostyFox.Worker.Posting/PostyFox.Worker.Posting.csproj
            assembly: PostyFox.Worker.Posting.dll
          - service: connectors-node
            context: src/connectors-node
            dockerfile: src/connectors-node/Dockerfile
            project: ""
            assembly: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.image_tag || github.sha }}

      - name: Determine image tag
        id: tag
        run: |
          if [ -z "${{ github.event.inputs.image_tag }}" ]; then
            TAG=$(git rev-parse HEAD)
          else
            TAG="${{ github.event.inputs.image_tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Normalize image repository name
        run: echo "IMAGE_REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Compute version
        id: ver
        run: |
          if LAST="$(git describe --tags --abbrev=0 2>/dev/null)"; then
            LAST="${LAST#v}"
          else
            LAST="0.0.0"
          fi
          echo "version=${LAST}-dev+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ env.IMAGE_REPOSITORY }}-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          build-args: |
            PROJECT=${{ matrix.project }}
            ASSEMBLY=${{ matrix.assembly }}
            VERSION=${{ steps.ver.outputs.version }}

  deploy-development:
    needs: [validate-confirmation, build-images]
    if: github.event.inputs.environment == 'development'
    name: Deploy development
    runs-on: [self-hosted]
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.image_tag || github.sha }}

      - name: Determine image tag
        id: tag
        run: |
          if [ -z "${{ github.event.inputs.image_tag }}" ]; then
            TAG=$(git rev-parse HEAD)
          else
            TAG="${{ github.event.inputs.image_tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Resolve image repository
        id: image
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve stack settings
        id: stack
        run: |
          echo "directory=dev" >> "$GITHUB_OUTPUT"
          echo "project=postyfox-dev" >> "$GITHUB_OUTPUT"

      - name: Copy deployment files
        env:
          STACK_DIR: /opt/postyfox/dev
        run: |
          echo "🧹 Removing stale gateway config, preserving any frontend-deployed overrides (conf.d/*.conf is glob-included; leftover fragments would still load)..."
          # The postyfox-frontend deploy drops routes/90-root.conf + upstreams/frontend.conf into this
          # same tree to point the SPA route at its container. Back those two up, wipe core's base, and
          # restore them after the copy so a frontend deploy survives a core redeploy.
          cd "$STACK_DIR"
          rm -rf .gwbak
          mkdir -p .gwbak/routes .gwbak/upstreams
          cp -p gateway/conf.d/routes/90-root.conf .gwbak/routes/ 2>/dev/null || true
          cp -p gateway/conf.d/upstreams/frontend.conf .gwbak/upstreams/ 2>/dev/null || true
          rm -rf gateway
          echo "📦 Copying deployment files to dev stack..."
          cp -a "$GITHUB_WORKSPACE"/deploy/docker-compose.server.yml \
            "$GITHUB_WORKSPACE"/deploy/docker-compose.dev.yml \
            "$GITHUB_WORKSPACE"/deploy/rabbitmq \
            "$GITHUB_WORKSPACE"/deploy/gateway \
            "$GITHUB_WORKSPACE"/deploy/oauth2-proxy \
            "$GITHUB_WORKSPACE"/deploy/vault \
            "$GITHUB_WORKSPACE"/deploy/fluent-bit \
            "$STACK_DIR"/
          echo "📦 Syncing otel collector config to dev stack (preserves any otel/certs)..."
          mkdir -p "$STACK_DIR"/otel
          cp -a "$GITHUB_WORKSPACE"/deploy/otel/config.yaml \
            "$GITHUB_WORKSPACE"/deploy/otel/config.central.yaml \
            "$STACK_DIR"/otel/
          echo "🔧 Restoring frontend gateway overrides (no-op on a core-only stack)..."
          [ -f .gwbak/routes/90-root.conf ] && cp -p .gwbak/routes/90-root.conf gateway/conf.d/routes/90-root.conf || true
          [ -f .gwbak/upstreams/frontend.conf ] && cp -p .gwbak/upstreams/frontend.conf gateway/conf.d/upstreams/frontend.conf || true
          rm -rf .gwbak

      - name: Deploy dev stack
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          STACK_DIR: /opt/postyfox/dev
        run: |
          echo "🚀 Manually deploying development stack..."
          echo "Image: $IMAGE_REPOSITORY:${IMAGE_TAG}"
          cd "$STACK_DIR"
          echo '📋 Checking .env file exists...'
          [ -f .env ] || { echo '❌ Missing .env file'; exit 1; }
          # Capture the workflow-resolved image coords BEFORE sourcing .env — a pinned or `latest`
          # IMAGE_TAG in .env would otherwise clobber the correct commit-SHA tag (there is no
          # `:latest` image; build-images only pushes commit-SHA tags).
          WF_IMAGE_REPOSITORY="$IMAGE_REPOSITORY"; WF_IMAGE_TAG="$IMAGE_TAG"
          source .env 2>/dev/null || true
          export IMAGE_REPOSITORY="$WF_IMAGE_REPOSITORY"
          export IMAGE_TAG="$WF_IMAGE_TAG"
          export COMPOSE_PROJECT_NAME=postyfox-dev
          echo '🔄 Pulling latest images...'
          docker compose -f docker-compose.server.yml -f docker-compose.dev.yml pull || { echo '❌ Failed to pull images'; exit 1; }
          echo '⬆️ Updating services...'
          docker compose -f docker-compose.server.yml -f docker-compose.dev.yml up -d --build || { echo '❌ Failed to start services'; exit 1; }
          echo '🔄 Reloading gateway + oauth2-proxy (their conf.d/templates are bind-mounted; up -d alone does not pick up content changes)...'
          docker compose -f docker-compose.server.yml -f docker-compose.dev.yml restart gateway oauth2-proxy || { echo '❌ Failed to restart gateway/oauth2-proxy'; exit 1; }
          echo '✅ Deployment completed'
          docker compose -f docker-compose.server.yml -f docker-compose.dev.yml ps

      - name: Health check
        env:
          STACK_DIR: /opt/postyfox/dev
        run: |
          echo "🏥 Running health checks..."
          sleep 10
          cd "$STACK_DIR"
          docker compose -f docker-compose.server.yml -f docker-compose.dev.yml ps | grep -E '(core-api|post-api)' | grep -E '(Up|healthy)' || {
            echo '⚠️ Warning: Services may still be starting'
          }
          true

      - name: Summary
        if: success()
        run: |
          cat << 'EOF'
          ✅ Manual deployment completed!

          📊 Deployment Details:
          - Environment: development
          - Image Tag: ${{ steps.tag.outputs.tag }}
          - Triggered by: ${{ github.actor }}
          - Runner: self-hosted Linux
          - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

  deploy-production:
    needs: [validate-confirmation, build-images]
    if: github.event.inputs.environment == 'production'
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    env:
      NAMESPACE: postyfox
      RELEASE_NAME: postyfox
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.image_tag || github.sha }}

      - name: Determine image tag
        id: tag
        run: |
          if [ -z "${{ github.event.inputs.image_tag }}" ]; then
            TAG=$(git rev-parse HEAD)
          else
            TAG="${{ github.event.inputs.image_tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$RUNNER_TEMP/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$RUNNER_TEMP/.kube/config"
          chmod 600 "$RUNNER_TEMP/.kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster connectivity
        run: kubectl cluster-info

      - name: Render secret overrides
        # See release.yml for the rationale — same secret set, same gitignored/workflow-local file.
        run: |
          cat > "$RUNNER_TEMP/values-secrets.yaml" <<EOF
          postgres:
            password: "${{ secrets.DB_PASSWORD }}"
          rabbitmq:
            password: "${{ secrets.RABBITMQ_PASSWORD }}"
          secrets:
            externalPostgresConnection: "${{ secrets.EXTERNAL_POSTGRES_CONNECTION }}"
            hashiCorpVaultSecretId: "${{ secrets.VAULT_SECRET_ID }}"
            internalToken: "${{ secrets.INTERNAL_TOKEN }}"
            objectStoreAccessKey: "${{ secrets.RUSTFS_ACCESS_KEY }}"
            objectStoreSecretKey: "${{ secrets.RUSTFS_SECRET_KEY }}"
          config:
            hashiCorpVaultRoleId: "${{ secrets.VAULT_ROLE_ID }}"
          oauth2Proxy:
            clientSecret: "${{ secrets.OIDC_CLIENT_SECRET }}"
            cookieSecret: "${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}"
          redis:
            password: "${{ secrets.REDIS_PASSWORD }}"
          EOF

      - name: Helm upgrade --install (⚠️ PRODUCTION)
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "🚀 Deploying image tag ${IMAGE_TAG} to prod k8s (namespace: ${NAMESPACE})..."
          helm upgrade --install "$RELEASE_NAME" deploy/helm/postyfox \
            --namespace "$NAMESPACE" --create-namespace \
            -f deploy/helm/postyfox/values-prod.yaml \
            -f "$RUNNER_TEMP/values-secrets.yaml" \
            --set image.tag="${IMAGE_TAG}" \
            --atomic --wait --timeout 5m \
            || { echo "❌ Helm upgrade failed (auto-rolled back by --atomic)"; exit 1; }
          echo "✅ Prod deployed"

      - name: Health check
        run: |
          kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/part-of=postyfox
          kubectl -n "$NAMESPACE" rollout status deployment/"$RELEASE_NAME"-core-api --timeout=60s || \
            echo "⚠️ Warning: core-api rollout not confirmed healthy within timeout"
          kubectl -n "$NAMESPACE" rollout status deployment/"$RELEASE_NAME"-post-api --timeout=60s || \
            echo "⚠️ Warning: post-api rollout not confirmed healthy within timeout"

      - name: Cleanup secret overrides
        if: always()
        run: rm -f "$RUNNER_TEMP/values-secrets.yaml" "$RUNNER_TEMP/.kube/config"

      - name: Summary
        if: success()
        run: |
          cat << 'EOF'
          ✅ Manual deployment completed!
          
          📊 Deployment Details:
          - Environment: production (Kubernetes namespace: postyfox)
          - Image Tag: ${{ steps.tag.outputs.tag }}
          - Triggered by: ${{ github.actor }}
          - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
