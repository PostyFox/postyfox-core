<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PostyFox Connect</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>PostyFox Connect</h1>
        <label class="env" title="Point at the development environment instead">
          <input id="dev-mode" type="checkbox">
          <span>Dev</span>
        </label>
      </header>

      <p id="status" role="status" aria-live="polite">Checking…</p>

      <label id="target-row" for="target" hidden>
        Connector
        <select id="target"></select>
      </label>

      <button id="action" type="button" hidden></button>

      <details id="manual">
        <summary>Use a pairing token instead</summary>
        <p class="hint">
          For a browser that is not signed in to PostyFox. Create the token on the connector in
          PostyFox, then paste it here.
        </p>
        <input id="pairing-token" type="password" autocomplete="off" spellcheck="false"
               placeholder="One-time pairing token">
        <button id="manual-connect" type="button" class="secondary">Connect with token</button>
      </details>

      <p class="privacy">
        Only the session cookies <span id="cookie-summary">the site requires</span> are sent, and only
        to <span id="origin-summary">PostyFox</span>. Nothing is displayed or saved by this extension.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
