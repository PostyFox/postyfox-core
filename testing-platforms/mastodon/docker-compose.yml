# Local, disposable Mastodon instance for manually testing the PostyFox Mastodon connector.
# `docker compose up -d` and wait for `admin-init` to exit 0 — everything else is automatic.
# See README.md for the test account and the manual test checklist.
#
# `net` is an internal-only network: no container here can reach the real internet, which is a
# hard backstop for "federation and mail are disabled" beyond the app-level config below. Published
# ports (below) still work — Docker's port-forwarding doesn't need outbound routing.

services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      # Must match DB_NAME in .env — the postgres image only auto-creates this on first boot, and
      # `rails db:migrate` (in `migrate`, below) expects it to already exist.
      POSTGRES_DB: mastodon_production
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [net]

  # One-shot: runs the DB migrations and seed data (Owner/Admin/Moderator UserRole rows —
  # admin-init's `--role Owner` needs these) the prebuilt image doesn't run on its own, then exits.
  migrate:
    image: ghcr.io/mastodon/mastodon:v4.7.1
    env_file: .env
    command: ["bash", "-c", "bundle exec rails db:migrate && bundle exec rails db:seed"]
    volumes:
      - ./local-overrides/zz_postyfox_local_http.rb:/opt/mastodon/config/initializers/zz_postyfox_local_http.rb:ro
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [net]

  web:
    image: ghcr.io/mastodon/mastodon:v4.7.1
    restart: unless-stopped
    env_file: .env
    command: bundle exec puma -C config/puma.rb
    healthcheck:
      test: ["CMD-SHELL", "curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes:
      - system-data:/mastodon/public/system
      - ./local-overrides/zz_postyfox_local_http.rb:/opt/mastodon/config/initializers/zz_postyfox_local_http.rb:ro
    networks: [net]

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.7.1
    restart: unless-stopped
    env_file: .env
    command: node ./streaming/index.js
    ports:
      - "${STREAMING_PORT:-4000}:4000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [net]

  sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.7.1
    restart: unless-stopped
    env_file: .env
    command: bundle exec sidekiq
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes:
      - system-data:/mastodon/public/system
      - ./local-overrides/zz_postyfox_local_http.rb:/opt/mastodon/config/initializers/zz_postyfox_local_http.rb:ro
    networks: [net]

  # One-shot: creates the confirmed test admin account (idempotent — safe to `up` again), pins its
  # password, and sets the instance's site contact (Setting.site_contact_username/_email — these are
  # DB-backed `Setting` rows, not env vars; normally an admin sets them by hand on first login via
  # Preferences > Administration > Server Settings, which never happens here since the account is
  # created headlessly), then exits. See README.md for the credentials.
  admin-init:
    image: ghcr.io/mastodon/mastodon:v4.7.1
    env_file: .env
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        bin/tootctl accounts create "$$ADMIN_USERNAME" --email "$$ADMIN_EMAIL" --confirmed --role Owner --approve || true
        bin/rails runner "
          u = User.find_by!(email: ENV['ADMIN_EMAIL'])
          u.password = ENV['ADMIN_PASSWORD']
          u.password_confirmation = ENV['ADMIN_PASSWORD']
          u.save!(validate: false)
          Setting.site_contact_username = ENV['ADMIN_USERNAME']
          Setting.site_contact_email = ENV['ADMIN_EMAIL']
        "
    volumes:
      - ./local-overrides/zz_postyfox_local_http.rb:/opt/mastodon/config/initializers/zz_postyfox_local_http.rb:ro
    depends_on:
      web: { condition: service_healthy }
    networks: [net]

networks:
  net:
    internal: true

volumes:
  db-data:
  redis-data:
  system-data:
