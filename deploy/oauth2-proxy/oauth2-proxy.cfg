# oauth2-proxy fronting core-api, wired to local Keycloak.
#
# Split front/back-channel so browser login and server-side token exchange each use a reachable
# address, while the token `iss` stays constant:
#   - Browser        → login at http://localhost:8082  (Keycloak published on the host)
#   - This container → token/JWKS at http://keycloak:8080  (in-cluster service DNS)
#   - Keycloak pins its issuer to http://localhost:8082 (KC_HOSTNAME), which every token's `iss`
#     matches, so validation succeeds even though the code is redeemed over the back channel.
http_address = "0.0.0.0:4180"
provider = "oidc"

skip_oidc_discovery = true
oidc_issuer_url = "http://localhost:8082/realms/PostyFox"
login_url = "http://localhost:8082/realms/PostyFox/protocol/openid-connect/auth"
redeem_url = "http://keycloak:8080/realms/PostyFox/protocol/openid-connect/token"
oidc_jwks_url = "http://keycloak:8080/realms/PostyFox/protocol/openid-connect/certs"

client_id = "oauth2-proxy"
client_secret = "oauth2-proxy-secret"
cookie_secret = "0123456789abcdef0123456789abcdef"
session_store_type = "redis"
redis_connection_url = "redis://redis:6379/0"
email_domains = ["*"]
redirect_url = "http://localhost:4180/oauth2/callback"

# The edge fronts BOTH APIs. A single root upstream is used (which preserves the full request path)
# pointing at an internal nginx gateway that path-routes to the two backends: post-api owns
# /api/posts and /api/webhooks, core-api is the catch-all. (oauth2-proxy's own sub-path upstreams
# rewrite the request to the mount path and drop the remainder, so the gateway does the routing.)
# The APIs and the gateway are not published publicly in a real deployment — the proxy is the only
# public route.
upstreams = ["http://gateway:80/"]

# The inbound webhook is anonymous (HMAC-signed) — external senders can't do an OIDC login, so skip
# auth for it (post-api still verifies the signature).
skip_auth_routes = [
    "POST=^/api/webhooks/",
    "POST=^/api/connectors/cookie-pairing/complete$",
    "OPTIONS=^/api/connectors/cookie-pairing/complete$",
    # Public platform metadata (which cookies a site needs) — the browser extension reads it before
    # the user has a PostyFox session, so it cannot sit behind login.
    "GET=^/api/connectors/cookie-pairing/sites$",
    # Privacy policy is a public SPA route (see postyfox-frontend's app.routes.ts) — readable
    # without signing in, and linked from the oauth2-proxy sign_in page (see ./templates).
    "GET=^/privacy$",
    # The SPA shell needed to render /privacy (and any other pre-auth route) — Angular's hashed
    # JS/CSS bundles, fonts and icons, plus favicon.ico. These carry no user data, so skipping auth
    # for them is safe; it just lets the app boot before a session exists.
    "GET=\\.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|map)$",
    # Fetched by DeploymentConfigService on EVERY app bootstrap (any route, including /privacy) —
    # see postyfox-frontend's app.config.ts provideAppInitializer. Without this, an unauthenticated
    # visitor gets a 401 here, which the global authInterceptor treats as "session expired" and
    # bounces to sign-in even on public routes. Static, operator-only config — no user data.
    "GET=^/deployment-config\\.json$",
]

# API callers get 401 instead of a 302 into Keycloak. The SPA already turns 401 into a re-login, and
# the PostyFox Connect extension needs an unambiguous "you are not signed in" — following a redirect
# to the login page would otherwise look like a successful response.
api_routes = ["^/api/"]

# Forward the validated OIDC ID token to the upstream as `Authorization: Bearer` so the APIs can
# validate it themselves (defence-in-depth) rather than trusting an injected identity header.
# NB: pass_authorization_header (upstream request) — NOT set_authorization_header (which only sets
# the header on the response, for nginx auth_request mode).
pass_authorization_header = true
pass_access_token = true
skip_provider_button = true

# Custom error.html — shown when the `gateway` upstream itself is unreachable/restarting (in
# addition to oauth2-proxy's other error cases). See ./templates/error.html.
# Custom sign_in.html — oauth2-proxy's default page with a "Privacy policy" footer link added, so
# it's reachable before a user has a session. See ./templates/sign_in.html. Any other template
# (e.g. a future custom login form) still falls back to oauth2-proxy's embedded defaults.
custom_templates_dir = "/etc/oauth2-proxy/templates"
