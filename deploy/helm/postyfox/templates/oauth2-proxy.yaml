# The ONLY component intended to be reached via the Ingress: fronts the internal gateway with
# OIDC login (any OIDC provider - Keycloak, Auth0, Entra ID, etc). Session store is this chart's
# own Redis instance (or your external one, if redis.enabled is false and you point
# oauth2Proxy.redisConnectionUrl elsewhere), opaque cookie sessions avoid browser cookie-size
# limits with the JWTs this stack passes through.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "postyfox.fullname" . }}-oauth2-proxy
  labels: {{- include "postyfox.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: { app.kubernetes.io/name: postyfox-oauth2-proxy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postyfox-oauth2-proxy }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/oauth2-proxy-config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: oauth2-proxy
          image: {{ .Values.oauth2Proxy.image }}
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "postyfox.secretName" . }}, key: OAuth2ProxyClientSecret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "postyfox.secretName" . }}, key: OAuth2ProxyCookieSecret } }
            - name: OAUTH2_PROXY_REDIS_PASSWORD_ENV
              valueFrom: { secretKeyRef: { name: {{ include "postyfox.secretName" . }}, key: OAuth2ProxyRedisPassword } }
            - name: OAUTH2_PROXY_REDIS_CONNECTION_URL
              value: "redis://:$(OAUTH2_PROXY_REDIS_PASSWORD_ENV)@{{ include "postyfox.fullname" . }}-redis:6379/0"
          ports:
            - { containerPort: 4180, name: http }
            - { containerPort: 44180, name: metrics }
          readinessProbe:
            httpGet: { path: /ping, port: 4180 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { mountPath: /etc/oauth2-proxy/oauth2-proxy.cfg, name: config, subPath: oauth2-proxy.cfg }
            - { mountPath: /etc/oauth2-proxy/templates/error.html, name: config, subPath: error.html }
          resources: {{- toYaml .Values.oauth2Proxy.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "postyfox.fullname" . }}-oauth2-proxy-conf
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postyfox.fullname" . }}-oauth2-proxy
  labels: {{- include "postyfox.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: postyfox-oauth2-proxy }
  ports:
    - { name: http, port: 4180, targetPort: 4180 }
    - { name: metrics, port: 44180, targetPort: 44180 }
