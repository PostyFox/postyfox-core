{{- if .Values.ingress.enabled }}
# Fronts the OIDC edge (oauth2-proxy) ONLY. core-api/post-api are ClusterIP and intentionally have
# no rule here — exposing them directly would bypass authentication at the network layer.
#
# className/annotations are left for the deployer to set (e.g. className: nginx|contour|traefik,
# annotations: { cert-manager.io/cluster-issuer: ... }) — nothing here assumes a specific ingress
# controller or certificate issuer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "postyfox.fullname" . }}-edge
  labels: {{- include "postyfox.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "postyfox.fullname" . }}-oauth2-proxy
                port: { number: 4180 }
{{- end }}
