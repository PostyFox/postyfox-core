{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postyfox.secretName" . }}
  labels: {{- include "postyfox.labels" . | nindent 4 }}
type: Opaque
stringData:
  ConnectionStrings__Postgres: {{ include "postyfox.postgresConnection" . | quote }}
  Secrets__HashiCorpVault__SecretId: {{ .Values.secrets.hashiCorpVaultSecretId | quote }}
  Secrets__HashiCorpVault__Token: {{ .Values.secrets.hashiCorpVaultToken | quote }}
  Secrets__BitWarden__ApiKey: {{ .Values.secrets.bitwardenApiKey | quote }}
  Secrets__BitWarden__ClientId: {{ .Values.secrets.bitwardenClientId | quote }}
  Secrets__BitWarden__ClientSecret: {{ .Values.secrets.bitwardenClientSecret | quote }}
  NodeConnectors__InternalToken: {{ .Values.secrets.internalToken | quote }}
  INTERNAL_TOKEN: {{ .Values.secrets.internalToken | quote }}
  ObjectStore__AccessKey: {{ .Values.secrets.objectStoreAccessKey | quote }}
  ObjectStore__SecretKey: {{ .Values.secrets.objectStoreSecretKey | quote }}
  RabbitMq__Password: {{ include "postyfox.rabbitMqPassword" . | quote }}
  # Same value as Secrets__HashiCorpVault__SecretId — used verbatim by the (chart-managed)
  # vault-init sidecar to pin the AppRole SecretId. Kept as a distinct key so vault-init doesn't
  # need to depend on the Secrets__ naming convention used by the .NET apps.
  VaultAppRoleSecretId: {{ .Values.secrets.hashiCorpVaultSecretId | quote }}
  RedisPassword: {{ .Values.redis.password | quote }}
  OAuth2ProxyClientSecret: {{ .Values.oauth2Proxy.clientSecret | quote }}
  OAuth2ProxyCookieSecret: {{ .Values.oauth2Proxy.cookieSecret | quote }}
  OAuth2ProxyRedisPassword: {{ .Values.redis.password | quote }}
{{- end }}
