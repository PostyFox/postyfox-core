{{- if .Values.postgres.enabled }}
# Self-contained PostgreSQL instance. Disable (postgres.enabled: false) and point
# secrets.externalPostgresConnection at your own managed/HA instance instead — see
# postyfox.postgresConnection in _helpers.tpl.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postyfox.fullname" . }}-postgres
  labels: {{- include "postyfox.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "postyfox.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postyfox-postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postyfox-postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.username | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ .Values.postgres.password | quote }} }
          ports: [{ containerPort: 5432, name: postgres }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}] }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - { mountPath: /var/lib/postgresql/data, name: postgresdata, subPath: pgdata }
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: postgresdata
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.postgres.storage.size }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postyfox.fullname" . }}-postgres
  labels: {{- include "postyfox.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postyfox-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
{{- end }}
