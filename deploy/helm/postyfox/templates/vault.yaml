{{- if .Values.vault.enabled }}
# Self-contained HashiCorp Vault — file storage backend + Shamir seal, auto-initialised/unsealed
# by the vault-init sidecar (ported from deploy/vault/bootstrap.sh), which also PINS the app's
# AppRole RoleId/SecretId to config.hashiCorpVaultRoleId / secrets.hashiCorpVaultSecretId so the
# apps can authenticate without a runtime token hand-off. Disable (vault.enabled: false) and set
# config.secretsProvider to point the apps at your own Vault / BitWarden / AzureKeyVault / Infisical.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postyfox.fullname" . }}-vault-config
  labels: {{- include "postyfox.labels" . | nindent 4 }}
data:
  vault.hcl: |
    ui = true

    storage "file" {
      path = "/vault/file"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      # TLS is terminated at the edge / handled by a service mesh — Vault never publishes outside
      # the cluster. Front it with a TLS terminator if you expose it beyond this namespace.
      tls_disable = true
    }

    api_addr = "http://{{ include "postyfox.fullname" . }}-vault:8200"

    # Containers frequently can't lock memory (no IPC_LOCK capability); disabling mlock keeps Vault
    # from refusing to start. Acceptable with the file backend here; enable it + grant IPC_LOCK if
    # your cluster's PodSecurityPolicy/SCC allows it.
    disable_mlock = true
  bootstrap.sh: |
    #!/bin/sh
    # PostyFox Vault bootstrap + auto-unseal + app-auth provisioning sidecar (ported unchanged from
    # deploy/vault/bootstrap.sh — see that file for full behavioural commentary).
    set -u

    VAULT_ADDR="${VAULT_ADDR:-http://127.0.0.1:8200}"
    export VAULT_ADDR

    KEY_FILE="/vault/init/init.json"
    KEY_SHARES="${VAULT_KEY_SHARES:-5}"
    KEY_THRESHOLD="${VAULT_KEY_THRESHOLD:-3}"

    APP_MOUNT="${VAULT_MOUNT:-secret}"
    APP_BASE_PATH="${VAULT_BASE_PATH:-postyfox}"
    APP_ROLE_NAME="${VAULT_APP_ROLE_NAME:-postyfox}"
    APP_POLICY_NAME="${VAULT_APP_POLICY_NAME:-postyfox}"
    APP_ROLE_ID="${VAULT_ROLE_ID:-}"
    APP_SECRET_ID="${VAULT_SECRET_ID:-}"

    log() { echo "[vault-bootstrap] $*"; }
    status_field() { vault status 2>/dev/null | awk -v f="$1" '$1 == f {print $2}'; }

    log "waiting for Vault at ${VAULT_ADDR} ..."
    until vault status >/dev/null 2>&1 || [ $? -eq 2 ]; do
      sleep 2
    done

    if [ "$(status_field Initialized)" = "true" ]; then
      log "Vault already initialised"
    else
      log "initialising Vault (key-shares=${KEY_SHARES} key-threshold=${KEY_THRESHOLD})"
      if ! vault operator init \
          -key-shares="$KEY_SHARES" \
          -key-threshold="$KEY_THRESHOLD" \
          -format=json > "$KEY_FILE"; then
        log "ERROR: vault operator init failed"
        rm -f "$KEY_FILE"
        exit 1
      fi
      chmod 600 "$KEY_FILE" 2>/dev/null || true
      log "unseal keys + root token written to ${KEY_FILE}"
    fi

    if [ ! -f "$KEY_FILE" ]; then
      log "ERROR: Vault is initialised but ${KEY_FILE} is missing — cannot auto-unseal."
      exit 1
    fi

    FLAT=$(tr -d '\n\r\t ' < "$KEY_FILE")
    UNSEAL_KEYS=$(printf '%s' "$FLAT" | sed 's/.*"unseal_keys_b64":\[//; s/\].*//' | tr ',' '\n' | tr -d '"')
    ROOT_TOKEN=$(printf '%s' "$FLAT" | sed 's/.*"root_token":"//; s/".*//')

    if [ -z "$UNSEAL_KEYS" ]; then
      log "ERROR: no unseal keys found in ${KEY_FILE}"
      exit 1
    fi

    apply_unseal() {
      echo "$UNSEAL_KEYS" | while IFS= read -r key; do
        [ -n "$key" ] || continue
        if [ "$(status_field Sealed)" = "false" ]; then
          break
        fi
        vault operator unseal "$key" >/dev/null 2>&1 || true
      done
    }

    provision_app_auth() {
      if [ -z "$APP_ROLE_ID" ] || [ -z "$APP_SECRET_ID" ]; then
        log "app AppRole provisioning skipped (VAULT_ROLE_ID / VAULT_SECRET_ID not set)"
        return 0
      fi
      if [ -z "$ROOT_TOKEN" ]; then
        log "WARN: no root token in ${KEY_FILE} — cannot provision app AppRole"
        return 0
      fi

      VAULT_TOKEN="$ROOT_TOKEN"
      export VAULT_TOKEN

      if vault secrets list -format=json 2>/dev/null | grep -q "\"${APP_MOUNT}/\""; then
        :
      else
        log "enabling KV v2 secrets engine at '${APP_MOUNT}/'"
        vault secrets enable -path="$APP_MOUNT" kv-v2 >/dev/null 2>&1 || true
      fi

      log "writing policy '${APP_POLICY_NAME}'"
      vault policy write "$APP_POLICY_NAME" - >/dev/null 2>&1 <<EOF
    path "${APP_MOUNT}/data/${APP_BASE_PATH}/*" {
      capabilities = ["create", "read", "update", "delete"]
    }
    path "${APP_MOUNT}/metadata/${APP_BASE_PATH}/*" {
      capabilities = ["read", "list", "delete"]
    }
    path "${APP_MOUNT}/metadata/${APP_BASE_PATH}" {
      capabilities = ["read", "list"]
    }
    EOF

      if vault auth list -format=json 2>/dev/null | grep -q '"approle/"'; then
        :
      else
        log "enabling AppRole auth backend"
        vault auth enable approle >/dev/null 2>&1 || true
      fi

      log "configuring AppRole role '${APP_ROLE_NAME}'"
      vault write "auth/approle/role/${APP_ROLE_NAME}" \
        token_policies="$APP_POLICY_NAME" \
        secret_id_num_uses=0 \
        secret_id_ttl=0 \
        token_ttl=1h \
        token_max_ttl=4h >/dev/null 2>&1 || true

      vault write "auth/approle/role/${APP_ROLE_NAME}/role-id" \
        role_id="$APP_ROLE_ID" >/dev/null 2>&1 || true
      vault write "auth/approle/role/${APP_ROLE_NAME}/custom-secret-id" \
        secret_id="$APP_SECRET_ID" >/dev/null 2>&1 || true

      log "app AppRole '${APP_ROLE_NAME}' ready (mount='${APP_MOUNT}' base='${APP_BASE_PATH}')"
      unset VAULT_TOKEN
    }

    if [ "$(status_field Sealed)" != "false" ]; then
      log "Vault is sealed — unsealing"
      apply_unseal
    fi
    if [ "$(status_field Sealed)" = "false" ]; then
      provision_app_auth
    fi

    log "entering unseal watch loop"
    while true; do
      case "$(status_field Sealed)" in
        true)
          log "Vault is sealed — unsealing"
          apply_unseal
          if [ "$(status_field Sealed)" = "false" ]; then
            log "Vault unsealed"
            provision_app_auth
          else
            log "WARN: Vault still sealed after applying keys"
          fi
          ;;
        false) : ;;
        *) : ;;
      esac
      sleep 5
    done
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postyfox.fullname" . }}-vault
  labels: {{- include "postyfox.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "postyfox.fullname" . }}-vault
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postyfox-vault }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postyfox-vault }
    spec:
      containers:
        - name: vault
          image: {{ .Values.vault.image }}
          imagePullPolicy: IfNotPresent
          command: ["vault", "server", "-config=/vault/config/vault.hcl"]
          securityContext:
            capabilities: { add: ["IPC_LOCK"] }
          ports: [{ containerPort: 8200, name: vault }]
          readinessProbe:
            httpGet: { path: "/v1/sys/health?standbyok=true&sealedcode=200", port: 8200 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { mountPath: /vault/config, name: vault-config }
            - { mountPath: /vault/file, name: vaultdata }
          resources: {{- toYaml .Values.vault.resources | nindent 12 }}
        - name: vault-init
          image: {{ .Values.vault.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/bootstrap.sh"]
          env:
            - { name: VAULT_ADDR, value: "http://127.0.0.1:8200" }
            - { name: VAULT_KEY_SHARES, value: {{ .Values.vault.keyShares | quote }} }
            - { name: VAULT_KEY_THRESHOLD, value: {{ .Values.vault.keyThreshold | quote }} }
            - { name: VAULT_MOUNT, value: {{ .Values.config.hashiCorpVaultMountPoint | quote }} }
            - { name: VAULT_BASE_PATH, value: {{ .Values.config.hashiCorpVaultBasePath | quote }} }
            - { name: VAULT_APP_ROLE_NAME, value: {{ .Values.vault.appRoleName | quote }} }
            - { name: VAULT_APP_POLICY_NAME, value: {{ .Values.vault.appPolicyName | quote }} }
            - { name: VAULT_ROLE_ID, value: {{ .Values.config.hashiCorpVaultRoleId | quote }} }
            - name: VAULT_SECRET_ID
              valueFrom: { secretKeyRef: { name: {{ include "postyfox.secretName" . }}, key: VaultAppRoleSecretId } }
          volumeMounts:
            - { mountPath: /scripts, name: bootstrap-script }
            - { mountPath: /vault/init, name: vaultkeys }
          resources: {{- toYaml .Values.vault.resources | nindent 12 }}
      volumes:
        - name: vault-config
          configMap:
            name: {{ include "postyfox.fullname" . }}-vault-config
            items: [{ key: vault.hcl, path: vault.hcl }]
        - name: bootstrap-script
          configMap:
            name: {{ include "postyfox.fullname" . }}-vault-config
            items: [{ key: bootstrap.sh, path: bootstrap.sh }]
  volumeClaimTemplates:
    - metadata:
        name: vaultdata
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.vault.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.vault.storage.dataSize }} }
    - metadata:
        name: vaultkeys
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.vault.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.vault.storage.keysSize }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postyfox.fullname" . }}-vault
  labels: {{- include "postyfox.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: postyfox-vault }
  ports: [{ port: 8200, targetPort: 8200 }]
{{- end }}
