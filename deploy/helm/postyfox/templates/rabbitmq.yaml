{{- if .Values.rabbitmq.enabled }}
# Self-contained RabbitMQ instance, with the delayed-message-exchange + prometheus plugins
# installed at container start (init container downloads the plugin, postStart hook enables both
# and cycles the app to hot-load the exchange type) so the stock upstream image can be used as-is.
# Disable (rabbitmq.enabled: false) and point secrets.externalRabbitMq* at your own broker instead.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postyfox.fullname" . }}-rabbitmq
  labels: {{- include "postyfox.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "postyfox.fullname" . }}-rabbitmq
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postyfox-rabbitmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postyfox-rabbitmq }
    spec:
      initContainers:
        - name: fetch-delayed-exchange-plugin
          image: curlimages/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              curl -fsSL -o /extra-plugins/rabbitmq_delayed_message_exchange-{{ .Values.rabbitmq.delayedMessageExchangeVersion }}.ez \
                "https://github.com/rabbitmq/rabbitmq-delayed-message-exchange/releases/download/v{{ .Values.rabbitmq.delayedMessageExchangeVersion }}/rabbitmq_delayed_message_exchange-{{ .Values.rabbitmq.delayedMessageExchangeVersion }}.ez"
              chmod 0644 /extra-plugins/*.ez
          volumeMounts:
            - { mountPath: /extra-plugins, name: extra-plugins }
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: {{ .Values.rabbitmq.username | quote }} }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: {{ include "postyfox.secretName" . }}, key: RabbitMq__Password } }
            - { name: RABBITMQ_PLUGINS_DIR, value: "/opt/rabbitmq/plugins:/extra-plugins" }
          ports:
            - { containerPort: 5672, name: amqp }
            - { containerPort: 15672, name: management }
            - { containerPort: 15692, name: prometheus }
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    until rabbitmqctl status >/dev/null 2>&1; do sleep 2; done
                    rabbitmq-plugins enable --offline rabbitmq_delayed_message_exchange rabbitmq_prometheus || true
                    # `--offline` only rewrites the enabled_plugins file; it does not hot-load an
                    # exchange-type plugin into the already-running node. A stop_app/start_app
                    # cycle (cheap: reloads the Erlang app, not the whole container) is required
                    # so rabbitmq_delayed_message_exchange actually registers x-delayed-message.
                    rabbitmqctl stop_app || true
                    rabbitmqctl start_app || true
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "check_running"] }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - { mountPath: /var/lib/rabbitmq, name: rabbitmqdata }
            - { mountPath: /extra-plugins, name: extra-plugins }
          resources: {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
      volumes:
        - { name: extra-plugins, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: rabbitmqdata
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.rabbitmq.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.rabbitmq.storage.size }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postyfox.fullname" . }}-rabbitmq
  labels: {{- include "postyfox.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postyfox-rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: management, port: 15672, targetPort: 15672 }
    - { name: prometheus, port: 15692, targetPort: 15692 }
{{- end }}
