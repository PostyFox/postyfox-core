# Internal nginx path router sitting behind oauth2-proxy — not published (only oauth2-proxy's
# Service is fronted by the Ingress). Composed from conf.d fragments so each concern owns its own
# file; the "/" catch-all proxies to a separately-deployed frontend Service when
# gateway.frontend.enabled is set, else falls back to core-api. Ships a fluent-bit sidecar shipping
# access/error logs to the otel-collector's dedicated nginx receiver.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postyfox.fullname" . }}-gateway-conf
  labels: {{- include "postyfox.labels" . | nindent 4 }}
data:
  nginx.conf: |
    # Internal path router sitting behind oauth2-proxy. Not published — only oauth2-proxy is public.
    #
    # The router is composed from fragments in conf.d so each concern owns its own file:
    #   conf.d/upstreams/*.conf  — backend upstreams (http context)
    #   conf.d/routes/*.conf     — location blocks (server context), applied in filename order
    #
    # This lets a companion deployment (e.g. the PostyFox frontend) drop in its own upstream and a
    # routes/90-root.conf that re-points the catch-all at the SPA, without this repo owning that
    # config or the frontend repo having to duplicate the API routing. See postyfox-frontend/deploy.
    # Access/error logs go to files on a shared volume, tailed by the fluent-bit sidecar and shipped to
    # OpenSearch (ss4o_logs-nginx-*). Not stdout, so they stay off the OTel/journald path.
    error_log /var/log/gateway/error.log warn;
    events {}
    http {
      access_log /var/log/gateway/access.log combined;
      # Bumped from nginx's 1m default: headroom for API payloads (e.g. media manifests) and browser
      # OTLP trace batches. The /otlp route caps itself tighter (see conf.d/routes/20-otlp.conf).
      client_max_body_size 10m;
      # oauth2-proxy already forwards the real scheme (https) from the public TLS edge, but this
      # listener is plain HTTP internally, so $scheme is always "http" and must NOT overwrite an
      # inbound X-Forwarded-Proto — only fill it in when it's genuinely absent (e.g. gateway hit
      # directly, such as in local dev without the oauth2-proxy/gateway chain).
      map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
      }

      # DNS resolver for request-time name resolution (used by variable proxy_pass, e.g. the frontend
      # SPA route). nginx's `resolver` needs a literal IP and can't read /etc/resolv.conf itself, and
      # that IP is runtime-specific (Docker embedded DNS 127.0.0.11 vs podman/netavark Aardvark at a
      # per-network address). The 40-resolver.envsh entrypoint hook derives it from the container's
      # /etc/resolv.conf and writes it here at startup. Glob include → harmless no-op if the hook was
      # not run (e.g. bare `nginx -t`) and nothing needs a resolver.
      include /etc/nginx/resolver.d/*.conf;

      # Backend upstreams (core/post here; a deployment may add more, e.g. the frontend container).
      include /etc/nginx/conf.d/upstreams/*.conf;

      server {
        listen 80;
        # Preserve the original Host/scheme (set by oauth2-proxy from the public TLS edge) instead of
        # nginx's default of rewriting Host to the upstream name (e.g. "core"). Without this, the
        # backends see plain HTTP on an internal hostname, so absolute URLs they generate (like the
        # OpenAPI "servers" entry used by Swagger's "Try it out") point at "http://core/..." and get
        # blocked as mixed content by browsers.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Serve the maintenance page (conf.d/routes/05-maintenance.conf) instead of a raw error whenever
        # a backend is unreachable/mid-restart. No "=" here — that preserves the original 502/503/504
        # status on the response rather than remapping it.
        proxy_intercept_errors on;
        error_page 502 503 504 @maintenance;

        # Gateway's own liveness (for the container healthcheck) — not routed to a backend.
        location = /healthz { access_log off; return 200 "ok\n"; }

        # Route fragments, loaded in filename order (…/routes/90-root.conf owns the catch-all).
        include /etc/nginx/conf.d/routes/*.conf;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postyfox.fullname" . }}-gateway-maintenance
  labels: {{- include "postyfox.labels" . | nindent 4 }}
data:
  maintenance.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>PostyFox — Maintenance</title>
      <style>
        body {
          margin: 0;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #f5f5f5;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          color: #222;
        }
        .box {
          max-width: 480px;
          text-align: center;
          padding: 2.5rem;
          background: #fff;
          border-radius: 8px;
          box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }
        h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
        p { margin: 0.25rem 0; color: #555; }
      </style>
    </head>
    <body>
      <div class="box">
        <h1>We'll be right back</h1>
        <p>PostyFox is undergoing scheduled maintenance.</p>
        <p>Please check back in a few minutes.</p>
      </div>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postyfox.fullname" . }}-gateway-upstreams
  labels: {{- include "postyfox.labels" . | nindent 4 }}
data:
  backends.conf: |
    upstream core { server {{ include "postyfox.fullname" . }}-core-api:8080; }
    upstream post { server {{ include "postyfox.fullname" . }}-post-api:8080; }
  {{- if .Values.gateway.frontend.enabled }}
  frontend.conf: |
    # `set` is only valid in server/location/if context, but this file is included at the http
    # level (see nginx.conf) — use `map` instead, which is an http-context directive and gives us
    # the same "$frontend_upstream is always defined" variable for the resolver + proxy_pass in
    # routes/90-root.conf.
    map $host $frontend_upstream {
      default "http://{{ .Values.gateway.frontend.serviceName }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.gateway.frontend.servicePort }}";
    }
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postyfox.fullname" . }}-gateway-routes
  labels: {{- include "postyfox.labels" . | nindent 4 }}
data:
  05-maintenance.conf: |
    # Maintenance mode toggle: operators create ./gateway/maintenance/maintenance.flag (e.g. `touch`
    # before a planned deploy, `rm` after) to force every request through the maintenance page below,
    # regardless of backend health. nginx re-stats the file on every request (no reload needed), so the
    # flag can be flipped mid-flight by a deploy script.
    if (-f /etc/nginx/maintenance/maintenance.flag) {
        return 503;
    }

    # Serves the maintenance page for the flag above AND for automatic 502/503/504s raised when
    # core-api/post-api are unreachable (e.g. mid-restart during a rolling update) — see
    # proxy_intercept_errors/error_page in nginx.conf.
    location @maintenance {
        root /etc/nginx/maintenance;
        internal;
        try_files /maintenance.html =503;
    }
  10-apis.conf: |
    # post-api owns these paths, plus its Swagger/OpenAPI (published under distinct paths so they
    # don't collide with core-api's /swagger + /openapi).
    location /api/posts    { proxy_pass http://post; }
    location /api/webhooks { proxy_pass http://post; }
    location /swagger-post { proxy_pass http://post; }
    location /openapi-post { proxy_pass http://post; }

    # core-api owns the rest of the API surface + its own docs. These are explicit (rather than
    # relying on the catch-all) so that /-rooted traffic can be handed to a frontend SPA when one is
    # deployed, while the API and docs keep routing to core.
    location /api/media  {
                           client_max_body_size 30m;
                           proxy_pass http://core;
                         }
    location /api/       { proxy_pass http://core; }
    location /swagger    { proxy_pass http://core; }
    location /openapi    { proxy_pass http://core; }
  20-otlp.conf: |
    # Browser (SPA) OpenTelemetry traces -> internal OTel collector's OTLP/HTTP receiver. Same-origin
    # path (no CORS to configure); sits behind oauth2-proxy so only authenticated sessions can post.
    location = /otlp/v1/traces {
        client_max_body_size 4m;
        proxy_pass http://{{ include "postyfox.fullname" . }}-otel-collector:4318/v1/traces;
    }
  90-root.conf: |
    {{- if .Values.gateway.frontend.enabled }}
    # A frontend/SPA release is enabled: proxy "/" there via the resolver + variable set in
    # upstreams/frontend.conf, so an unready/removed frontend degrades to the maintenance page
    # (proxy_intercept_errors + error_page in nginx.conf) rather than a hard nginx startup failure.
    location / { proxy_pass $frontend_upstream; }
    {{- else }}
    # Catch-all (core-only default): everything not matched by an explicit route above goes to
    # core-api. Enable gateway.frontend to point "/" at a separately-deployed frontend Service
    # instead.
    location / { proxy_pass http://core; }
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postyfox.fullname" . }}-fluent-bit-conf
  labels: {{- include "postyfox.labels" . | nindent 4 }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush            5
        Daemon           Off
        Log_Level        info

    [INPUT]
        Name             tail
        Tag              nginx.access
        Path             /var/log/gateway/access.log
        Refresh_Interval 5
        Read_from_Head   On
        Inotify_Watcher  Off
        DB               /var/lib/fluent-bit/nginx-access.db

    [INPUT]
        Name             tail
        Tag              nginx.error
        Path             /var/log/gateway/error.log
        Refresh_Interval 5
        Read_from_Head   On
        Inotify_Watcher  Off
        DB               /var/lib/fluent-bit/nginx-error.db

    [OUTPUT]
        Name             opentelemetry
        Match            nginx.*
        Host             {{ include "postyfox.fullname" . }}-otel-collector
        Port             4319
        Logs_uri         /v1/logs
        logs_body_key    $log
        Log_response_payload False
        tls              Off
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "postyfox.fullname" . }}-gateway
  labels: {{- include "postyfox.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: { app.kubernetes.io/name: postyfox-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postyfox-gateway }
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /etc/nginx/resolver.d
              # nginx's `resolver` directive needs a literal IP and can't read /etc/resolv.conf
              # itself; derive it from THIS pod's resolv.conf (kube-dns/CoreDNS ClusterIP) at
              # startup, exactly as deploy/gateway does for Docker/podman's embedded DNS.
              awk '/^nameserver/ { print "resolver " $2 " valid=10s;"; exit }' /etc/resolv.conf > /etc/nginx/resolver.d/resolver.conf
              exec nginx -g 'daemon off;'
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { mountPath: /etc/nginx/nginx.conf, name: nginx-conf, subPath: nginx.conf }
            - { mountPath: /etc/nginx/maintenance, name: maintenance }
            - { mountPath: /etc/nginx/conf.d/upstreams, name: upstreams }
            - { mountPath: /etc/nginx/conf.d/routes, name: routes }
            - { mountPath: /etc/nginx/resolver.d, name: resolver-dir }
            - { mountPath: /var/log/gateway, name: gateway-logs }
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
        - name: fluent-bit
          image: {{ .Values.gateway.fluentBitImage }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - { mountPath: /fluent-bit/etc, name: fluent-bit-conf }
            - { mountPath: /var/log/gateway, name: gateway-logs, readOnly: true }
            - { mountPath: /var/lib/fluent-bit, name: fluent-bit-db }
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - { name: nginx-conf, configMap: { name: {{ include "postyfox.fullname" . }}-gateway-conf } }
        - { name: maintenance, configMap: { name: {{ include "postyfox.fullname" . }}-gateway-maintenance } }
        - { name: upstreams, configMap: { name: {{ include "postyfox.fullname" . }}-gateway-upstreams } }
        - { name: routes, configMap: { name: {{ include "postyfox.fullname" . }}-gateway-routes } }
        - { name: fluent-bit-conf, configMap: { name: {{ include "postyfox.fullname" . }}-fluent-bit-conf } }
        - { name: resolver-dir, emptyDir: {} }
        - { name: gateway-logs, emptyDir: {} }
        - { name: fluent-bit-db, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postyfox.fullname" . }}-gateway
  labels: {{- include "postyfox.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: postyfox-gateway }
  ports: [{ port: 80, targetPort: 80 }]
