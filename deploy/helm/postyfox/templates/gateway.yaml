# Internal nginx path router sitting behind oauth2-proxy: not published (only oauth2-proxy's
# Service is fronted by the Ingress). Composed from conf.d fragments so each concern owns its own
# file; the "/" catch-all proxies to a separately-deployed frontend Service when
# gateway.frontend.enabled is set, else falls back to core-api. Ships a fluent-bit sidecar shipping
# access/error logs to the otel-collector's dedicated nginx receiver.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "postyfox.fullname" . }}-gateway
  labels: {{- include "postyfox.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: { app.kubernetes.io/name: postyfox-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postyfox-gateway }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway-config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /etc/nginx/resolver.d
              # nginx's `resolver` directive needs a literal IP and can't read /etc/resolv.conf
              # itself; derive it from THIS pod's resolv.conf (kube-dns/CoreDNS ClusterIP) at
              # startup, exactly as deploy/gateway does for Docker/podman's embedded DNS.
              awk '/^nameserver/ { print "resolver " $2 " valid=10s;"; exit }' /etc/resolv.conf > /etc/nginx/resolver.d/resolver.conf
              exec nginx -g 'daemon off;'
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { mountPath: /etc/nginx/nginx.conf, name: nginx-conf, subPath: nginx.conf }
            - { mountPath: /etc/nginx/maintenance, name: maintenance }
            - { mountPath: /etc/nginx/conf.d/upstreams, name: upstreams }
            - { mountPath: /etc/nginx/conf.d/routes, name: routes }
            - { mountPath: /etc/nginx/resolver.d, name: resolver-dir }
            - { mountPath: /var/log/gateway, name: gateway-logs }
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
        - name: fluent-bit
          image: {{ .Values.gateway.fluentBitImage }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - { mountPath: /fluent-bit/etc, name: fluent-bit-conf }
            - { mountPath: /var/log/gateway, name: gateway-logs, readOnly: true }
            - { mountPath: /var/lib/fluent-bit, name: fluent-bit-db }
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - { name: nginx-conf, configMap: { name: {{ include "postyfox.fullname" . }}-gateway-conf } }
        - { name: maintenance, configMap: { name: {{ include "postyfox.fullname" . }}-gateway-maintenance } }
        - { name: upstreams, configMap: { name: {{ include "postyfox.fullname" . }}-gateway-upstreams } }
        - { name: routes, configMap: { name: {{ include "postyfox.fullname" . }}-gateway-routes } }
        - { name: fluent-bit-conf, configMap: { name: {{ include "postyfox.fullname" . }}-fluent-bit-conf } }
        - { name: resolver-dir, emptyDir: {} }
        - { name: gateway-logs, emptyDir: {} }
        - { name: fluent-bit-db, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postyfox.fullname" . }}-gateway
  labels: {{- include "postyfox.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: postyfox-gateway }
  ports: [{ port: 80, targetPort: 80 }]
